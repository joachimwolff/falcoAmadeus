site_name: falcoAmadeus
site_description: Quality control of sequencing libraries before alignment, a fork of falco with statistics beyond the FastQC report
site_author: Joachim Wolff
site_url: https://falcoamadeus.readthedocs.io/
repo_url: https://github.com/joachimwolff/falcoAmadeus
repo_name: joachimwolff/falcoAmadeus
edit_uri: edit/master/docs/
copyright: GNU General Public License v3

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Statistics beyond FastQC: statistics.md
  - Options: options.md
  - Benchmarks: benchmarks.md
  - Support and citation: support.md
